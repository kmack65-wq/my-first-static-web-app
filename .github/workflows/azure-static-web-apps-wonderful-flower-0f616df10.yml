name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main

jobs:
  - name: Build And Deploy
    uses: Azure/static-web-apps-deploy@v1
    with:
    azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_FLOWER_0F616DF10 }}
    action: upload
    app_location: src
    api_location: api
  output_location: ""


