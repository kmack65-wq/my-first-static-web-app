name: Azure Static Web Apps

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [ main ]

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v3
        
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          
          # ⬇️ HERE'S WHERE YOU ADD YOUR CONFIGURATION ⬇️
          app_location: "src"          # Location of your frontend code
          api_location: "api"          # Location of your Azure Functions
          output_location: "."         # Built app location (if any)
          app_build_command: "echo 'No frontend build required'"
          api_build_command: "cd api && npm install"
          
          # Routes configuration
          routes_location: "routes.json"  # Optional: if you have custom routes

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: deployment-artifacts
          path: ./

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
