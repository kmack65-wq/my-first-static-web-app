<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confirmación de Seguridad</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <div class="container">

    <!-- LOGO -->
    <div class="logo">
      <img src="assets/logo.png" alt="Kadean Construction" />
    </div>

    <!-- FORM WRAPPER -->
    <div id="formWrapper" class="card">

      <h1 id="pageTitle">Confirmación de Seguridad</h1>

      <!-- VIDEO -->
      <h2 id="videoTitle">Video de Seguridad Requerido</h2>

      <video
        id="safetyVideo"
        controls
        width="100%"
      >
        <source
          src="https://kadeansafetyvideos.blob.core.windows.net/videos/20260108_kadean_construction_orientation_spanish_v1_v1%20(1080p).mp4"
          type="video/mp4"
        />
        Su navegador no admite el elemento de video.
      </video>

      <p id="videoStatus" class="video-note">
        Debe ver el video completo antes de enviar.
      </p>

      <!-- FORM -->
      <form id="ackForm">

        <label id="labelFullName">Nombre Completo</label>
        <input id="fullName" required />

        <label id="labelCompany">Nombre de la Empresa</label>
        <input id="companyName" required />

        <label id="labelJobSite">Lugar de Trabajo</label>
        <select id="jobSite" required>
          <option value="">Seleccione un sitio de trabajo</option>
        </select>

        <label id="labelEmail">Correo Electrónico</label>
        <input id="email" type="email" />

        <label id="labelPhone">Phone</label>
<input
  id="phone"
  type="tel"
  inputmode="numeric"
  placeholder="123-456-7890"
  maxlength="12"
/>

        <!-- SIGNATURE -->
        <div class="signature-wrapper">
          <div class="signature-label">Firma</div>
          <canvas id="signatureCanvas"></canvas>
        </div>

        <button
          type="button"
          id="clearSignature"
          class="btn-secondary"
        >
          Borrar Firma
        </button>

        <button
          type="submit"
          id="submitButton"
          class="btn-primary"
        >
          Enviar Confirmación
        </button>

        <div class="footer-note" id="footerNote">
          Al enviar este formulario, usted confirma que completó la capacitación de seguridad requerida.
        </div>

      </form>
    </div>

    <!-- SUCCESS SCREEN -->
    <div id="successScreen" class="success-screen hidden">
      <h1 id="successTitle">Envío Completo</h1>
      <p id="successMessage">
        Envío completo. Por favor tome una captura de pantalla.
      </p>
      <p id="submissionTime" class="timestamp"></p>
    </div>

  </div>

  <!-- APP CONFIG -->
  <script>
    window.APP_CONFIG = {
      requireVideo: true,
      language: "es"
    };
  </script>

  <!-- APP SCRIPT -->
  <script src="app.js"></script>

</body>
</html>
