<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Safety Acknowledgement</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="dark">

<div class="container">

  <div id="formSection">

    <h2>Safety Acknowledgement</h2>

    <form id="ackForm">

      <label>Full Name</label>
      <input type="text" id="fullName" required />

      <label>Company Name</label>
      <input type="text" id="companyName" required />

      <label>Job Site</label>
      <select id="jobSite" required>
        <option value="">Select a job site</option>
        <option>25-129 PHC Cardiac Rehab</option>
        <option>25-103 Ajax Memphis</option>
        <option>25-120 Blue Cloud Pittsburg</option>
        <option>24-116 BS-MOB 2 / Addition</option>
        <option>25-131 Eagle Point Expansion</option>
        <option>25-116 Harcros Chemical</option>
        <option>25-127 Alton Memorial SLCH Therapy</option>
        <option>25-126 Blue Cloud Toledo</option>
        <option>25-114 Mapletree Corp</option>
        <option>364 Logistics Center</option>
        <option>25-132 Blue Cloud Charlotte</option>
        <option>25-134 Blue Cloud Reno</option>
        <option>25-105 MBMC Switchgear</option>
        <option>25-111 PHC Power Plant</option>
        <option>23-159 BJH CPAP Renovation/ Change Order</option>
        <option>25-130 Kuna Freezer Expansion</option>
        <option>25-121 ABC Supply</option>
        <option>RMMC CO</option>
        <option>Fondren Surgical Suites</option>
      </select>

      <label>Email</label>
      <input type="email" id="email" required />

      <div class="section">
      <label>Safety Training Video</label>

      <video id="safetyVideo" controls width="100%">
      <source src="SafetyVideo2025.mp4" type="video/mp4">
         Your browser does not support the video tag.
  </video>

     <p class="status-info" id="videoStatus">
    Please watch the full video before submitting.
    </p>
  </div>


      <h3>Signature</h3>
      <canvas id="signaturePad"></canvas>

      <button type="button" id="clearBtn">Clear Signature</button>
      <button type="submit">Submit Acknowledgement</button>

    </form>

  </div>

  <!-- SUCCESS SCREEN -->
  <div id="successScreen" class="success-screen hidden">
    <h1>Submission Complete</h1>

    <p><strong>Please screenshot this screen for your records.</strong></p>

    <p id="submissionTimestamp" class="timestamp"></p>

    <p class="small">
      This confirms you have completed the required safety orientation.
    </p>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
