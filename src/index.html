<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Safety Orientation Acknowledgement</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="page-bg">
    <div class="app-card">

      <!-- HEADER -->
      <div class="header">
        <img src="assets/logo.png" alt="Kadean Construction" class="logo" />
        <h1>Safety Orientation Acknowledgement</h1>
        <h2>Required Safety Video</h2>
      </div>

      <!-- VIDEO CARD -->
      <div class="video-card">
        <div class="video-wrapper">
        <iframe
          src="https://www.youtube.com/embed/YSVeHAzz1oA"
          title="Safety Orientation Video"
          frameborder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen>
        </iframe>

        </div>

        <div class="video-warning">
          You must watch the entire video before submitting this form.
        </div>
      </div>

      <!-- FORM -->
      <form id="ackForm" class="form">

        <label>Full Name</label>
        <input id="fullName" required />

        <label>Company Name</label>
        <input id="companyName" required />

        <label>Job Site</label>
        <select id="jobSite">
          <option value="">Select a job site</option>
          <option>25-129 PHC Cardiac Rehab</option>
          <option>364 Logistics Center</option>
          <option>Fondren Surgical Suites</option>
        </select>

        <label>Phone</label>
        <input id="phone" />

        <label>Email</label>
        <input id="email" type="email" />

        <label>Signature</label>
        <canvas id="signaturePad"></canvas>
        <button type="button" id="clearSignature" class="secondary">
          Clear Signature
        </button>

        <button id="submitBtn" class="primary" disabled>
          Submit Acknowledgement
        </button>
      </form>

    </div>
  </div>

  <script src="script.js"></script>
  <script src="app.js"></script>
</body>
</html>
