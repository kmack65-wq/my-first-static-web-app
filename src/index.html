<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subcontractor Safety Acknowledgement</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="dark">
  <div class="container">
    <!-- LOGO -->
    <div class="logo">
      <img src="assets/logo.png" alt="Company Logo" />
    </div>

    <h1>Safety Orientation Acknowledgement</h1>

    <!-- VIDEO -->
    <section class="section">
      <h2>Required Safety Video</h2>
      <div class="video-wrapper">
        <iframe
          id="trainingVideo"
          src="https://www.youtube.com/embed/YSVeHAzz1oA?enablejsapi=1&rel=0&origin=https://wonderful-flower-0f616df10.1.azurestaticapps.net"
          title="Safety Training"
          allow="autoplay; encrypted-media"
          allowfullscreen>
        </iframe>
      </div>
      <div class="note">
        You must watch the entire video before submitting this form.
      </div>
    </section>

    <!-- FORM -->
    <form id="ackForm">
      <section class="section">
        <label for="fullName">Full Name</label>
        <input id="fullName" type="text" required />

        <label for="companyName">Company Name</label>
        <input id="companyName" type="text" required />

        <label for="jobSite">Job Site</label>
        <select id="jobSite" required>
          <option value="">Select a job site</option>
          <option value="25-129 PHC Cardiac Rehab">25-129 PHC Cardiac Rehab</option>
          <option value="25-103 Ajax Memphis">25-103 Ajax Memphis</option>
          <option value="25-120 Blue Cloud Pittsburg">25-120 Blue Cloud Pittsburg</option>
          <option value="24-116 BS-MOB 2 / Addition">24-116 BS-MOB 2 / Addition</option>
          <option value="25-131 Eagle Point Expansion">25-131 Eagle Point Expansion</option>
          <option value="25-116 Harcros Chemical">25-116 Harcros Chemical</option>
          <option value="25-127 Alton Memorial SLCH Therapy">25-127 Alton Memorial SLCH Therapy</option>
          <option value="25-126 Blue Cloud Toledo">25-126 Blue Cloud Toledo</option>
          <option value="25-114 Mapletree Corp">25-114 Mapletree Corp</option>
          <option value="364 Logistics Center">364 Logistics Center</option>
          <option value="25-132 Blue Cloud Charlotte">25-132 Blue Cloud Charlotte</option>
          <option value="25-134 Blue Cloud Reno">25-134 Blue Cloud Reno</option>
          <option value="25-105 MBMC Switchgear">25-105 MBMC Switchgear</option>
          <option value="25-111 PHC Power Plant">25-111 PHC Power Plant</option>
          <option value="23-159 BJH CPAP Renovation/ Change Order">23-159 BJH CPAP Renovation/ Change Order</option>
          <option value="25-130 Kuna Freezer Expansion">25-130 Kuna Freezer Expansion</option>
          <option value="25-121 ABC Supply">25-121 ABC Supply</option>
          <option value="RMMC CO">RMMC CO</option>
          <option value="Fondren Surgical Suites">Fondren Surgical Suites</option>
        </select>

        <label for="superintendent">Superintendent</label>
        <input
          id="superintendent"
          type="text"
          placeholder="Auto-filled based on job site"
          readonly
        />

        <label for="phone">Phone</label>
        <input id="phone" type="tel" />

        <label for="email">Email</label>
        <input id="email" type="email" />
      </section>

      <!-- SIGNATURE -->
      <section class="section">
        <h2>Signature</h2>
        <canvas id="signaturePad"></canvas>
        <div class="signature-actions">
          <button type="button" id="clearSignature">Clear Signature</button>
        </div>
      </section>

      <button type="submit" id="submitBtn" disabled>
        Submit Acknowledgement
      </button>
    </form>

    <div id="status"></div>

    <footer>
      By submitting this form, you confirm completion of the required safety training.
    </footer>
  </div>

  <!-- YouTube API -->
  <script src="https://www.youtube.com/iframe_api"></script>
  
  <!-- Unified script file -->
  <script src="script.js"></script>
  
  <!-- App logic (separate from UI controls) -->
  <script src="app.js"></script>
</body>
</html>
