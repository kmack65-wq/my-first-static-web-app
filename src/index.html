<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subcontractor Safety Acknowledgement</title>

  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <h1>Safety Orientation Acknowledgement</h1>
  <p id="status">Please watch the entire safety video.</p>

  <!-- ===== SAFETY VIDEO ===== -->
  <div id="videoContainer">
    <iframe
      id="trainingVideo"
      width="100%"
      height="450"
      src="https://www.youtube.com/embed/YSVeHAzz1oA?enablejsapi=1"
      title="Safety Orientation Video"
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen>
    </iframe>
  </div>

  <!-- ===== SIGNATURE ===== -->
  <section id="signatureSection">
    <h2>Signature</h2>
    <canvas id="signaturePad" width="500" height="200"></canvas>
    <button type="button" id="clearSignature">Clear Signature</button>
  </section>

  <!-- ===== FORM ===== -->
  <form id="ackForm">
    <label for="fullName">Full Name</label>
    <input id="fullName" name="fullName" required />

    <label for="companyName">Company Name</label>
    <input id="companyName" name="companyName" required />

    <label for="jobSite">Job Site</label>
    <select id="jobSite" name="jobSite">
      <option value="">Select a job site</option>
      <option>25-129 PHC Cardiac Rehab</option>
      <option>25-103 Ajax Memphis</option>
      <option>25-120 Blue Cloud Pittsburg</option>
      <option>24-116 BS-MOB 2 / Addition</option>
      <option>25-131 Eagle Point Expansion</option>
      <option>25-116 Harcros Chemical</option>
      <option>25-127 Alton Memorial SLCH Therapy</option>
      <option>25-126 Blue Cloud Toledo</option>
      <option>25-114 Mapletree Corp</option>
      <option>364 Logistics Center</option>
      <option>25-132 Blue Cloud Charlotte</option>
      <option>25-134 Blue Cloud Reno</option>
      <option>25-105 MBMC Switchgear</option>
      <option>25-111 PHC Power Plant</option>
      <option>23-159 BJH CPAP Renovation/ Change Order</option>
      <option>25-130 Kuna Freezer Expansion</option>
      <option>25-121 ABC Supply</option>
      <option>RMMC CO</option>
      <option>Fondren Surgical Suites</option>
    </select>

    <label for="phone">Phone</label>
    <input id="phone" name="phone" />

    <label for="email">Email</label>
    <input id="email" name="email" type="email" />

    <label for="superintendent">Superintendent</label>
    <input id="superintendent" name="superintendent" readonly />

    <button id="submitBtn" type="submit" disabled>
      Submit Acknowledgement
    </button>
  </form>

  <!-- ===== SCRIPTS ===== -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="script.js"></script>
  <script src="app.js"></script>
</body>
</html>
