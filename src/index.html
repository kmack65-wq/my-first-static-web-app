
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Safety Orientation Acknowledgement</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="container">
    <h1>Safety Orientation Acknowledgement</h1>
    <h2>Required Safety Video</h2>

    <!-- VIDEO -->
    <div class="video-wrapper">
      <iframe
        id="trainingVideo"
        src="https://www.youtube.com/embed/YSVeHAzz1oA?enablejsapi=1"
        title="Safety Orientation Video"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
      </iframe>
    </div>

    <p id="status" class="status">You must watch the entire video before submitting.</p>

    <!-- SIGNATURE -->
    <h3>Signature</h3>
    <canvas id="signaturePad" width="500" height="200"></canvas>
    <button type="button" id="clearSignature">Clear Signature</button>

    <!-- FORM -->
    <form id="ackForm">
      <label>Full Name</label>
      <input id="fullName" required />

      <label>Company Name</label>
      <input id="companyName" required />

      <label>Job Site</label>
      <select id="jobSite">
        <option value="">Select a job site</option>
        <option>25-129 PHC Cardiac Rehab</option>
        <option>364 Logistics Center</option>
        <option>Fondren Surgical Suites</option>
      </select>

      <label>Phone</label>
      <input id="phone" />

      <label>Email</label>
      <input id="email" type="email" />

      <label>Superintendent</label>
      <input id="superintendent" readonly />

      <button id="submitBtn" disabled>Submit Acknowledgement</button>
    </form>
  </main>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="script.js"></script>
  <script src="app.js"></script>
</body>
</html>
