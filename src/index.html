<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Safety Orientation Acknowledgement</title>
<body>
  <div class="app">

    <header class="header">
      <img src="assets/logo.png" alt="Kadean Construction" />
      <h1>Safety Orientation Acknowledgement</h1>
      <p class="notice">
        You must watch the entire safety video before submitting this form.
      </p>
    </header>

    <!-- VIDEO -->
    <section class="section">
      <h2>Required Safety Video</h2>

      <div id="videoWrapper">
        <div id="trainingVideo"></div>
      </div>

      <div id="status" class="status"></div>
    </section>

    <!-- SIGNATURE -->
    <section class="section">
      <h2>Signature</h2>
      <canvas id="signaturePad"></canvas>
      <button
        id="clearSignature"
        type="button"
        class="secondary"
      >
        Clear Signature
      </button>
    </section>

    <!-- FORM -->
    <section class="section">
      <form id="ackForm">
        <label>Full Name</label>
        <input id="fullName" required />

        <label>Company Name</label>
        <input id="companyName" required />

        <label>Job Site</label>
        <select id="jobSite" required>
          <option value="">Select job site</option>
          <option>25-129 PHC Cardiac Rehab</option>
          <option>364 Logistics Center</option>
          <option>Fondren Surgical Suites</option>
        </select>

        <button id="submitBtn" disabled>
          Submit Acknowledgement
        </button>
      </form>
    </section>

  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="script.js"></script>
</body>

  <link rel="stylesheet" href="styles.css" />
</head>


</html>
