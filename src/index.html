<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Safety Acknowledgement</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="dark">

  <div class="container">

    <!-- FORM SECTION -->
    <div id="formSection">

      <div class="logo">
        <img src="assets/logo.png" alt="Kadean Construction" />
      </div>

      <h1>Safety Acknowledgement</h1>

      <!-- VIDEO -->
      <section class="section">
        <h2>Required Safety Video</h2>

        <video
          id="safetyVideo"
          width="100%"
          controls
          preload="metadata"
        >
          <source
            src="https://kadeansafetyvideos.blob.core.windows.net/videos/SafetyVideo2025.mp4"
            type="video/mp4"
          />
          Your browser does not support the video tag.
        </video>

        <p id="videoStatus" class="status-info">
          You must watch the entire video before submitting.
        </p>
      </section>

      <!-- FORM -->
      <form id="ackForm">

        <section class="section">
          <label for="fullName">Full Name</label>
          <input id="fullName" required />

          <label for="companyName">Company Name</label>
          <input id="companyName" required />

          <label for="jobSite">Job Site</label>
          <select id="jobSite" required>
            <option value="">Select a job site</option>
          </select>

          <label for="email">Email</label>
          <input id="email" type="email" />
        </section>

        <!-- SIGNATURE -->
        <section class="section">
          <h2>Signature</h2>

          <canvas id="signatureCanvas"></canvas>

          <button type="button" id="clearSignature">
            Clear Signature
          </button>
        </section>

        <button type="submit">
          Submit Acknowledgement
        </button>
      </form>

      <footer>
        By submitting this form, you confirm completion of the required safety training.
      </footer>

    </div>

    <!-- SUCCESS SCREEN -->
    <div id="successScreen" class="success-screen hidden">
      <h1>Submission Complete</h1>
      <p>
        Submission complete. Please screenshot this screen.
      </p>
      <p id="submissionTimestamp" class="small"></p>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
