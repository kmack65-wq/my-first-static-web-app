<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Safety Orientation Acknowledgement</title>

  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <header class="header">
    <h1>Safety Orientation Acknowledgement</h1>
    <p class="notice">You must watch the entire safety video before submitting.</p>
  </header>

  <!-- ===== VIDEO ===== -->
  <section class="section">
    <h2>Required Safety Video</h2>

    <div id="videoWrapper">
      <!-- YouTube API injects iframe here -->
      <div id="trainingVideo"></div>
    </div>

    <div id="status" class="status"></div>
  </section>

  <!-- ===== SIGNATURE ===== -->
  <section class="section">
    <h2>Signature</h2>

    <canvas id="signaturePad" width="800" height="200"></canvas>
    <button id="clearSignature" type="button">Clear Signature</button>
  </section>

  <!-- ===== FORM ===== -->
  <form id="ackForm" class="section">
    <label>Full Name</label>
    <input id="fullName" required />

    <label>Company Name</label>
    <input id="companyName" required />

    <label>Job Site</label>
    <select id="jobSite" required>
      <option value="">Select job site</option>
      <option>25-129 PHC Cardiac Rehab</option>
      <option>25-103 Ajax Memphis</option>
      <option>25-120 Blue Cloud Pittsburg</option>
      <option>364 Logistics Center</option>
      <option>Fondren Surgical Suites</option>
    </select>

    <label>Phone</label>
    <input id="phone" />

    <label>Email</label>
    <input id="email" type="email" />

    <button id="submitBtn" disabled>Submit Acknowledgement</button>
  </form>

  <!-- YouTube API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <!-- App scripts -->
  <script src="script.js"></script>
</body>
</html>
